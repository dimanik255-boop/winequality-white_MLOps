[project]
name = "wine-quality-mlops"
version = "0.1.0"
description = "Wine Quality regression: prepare → train RandomForest → FastAPI → Streamlit"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "PyYAML>=6,<7",
    "requests>=2.31,<3",
    "scikit-learn>=1.4,<2",
    "streamlit>=1.35,<2",
    "uvicorn>=0.29,<1",
]

[dependency-groups]
dev = [
    "dvc>=3,<5",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
